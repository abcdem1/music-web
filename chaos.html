const PAGE_SIZE = 10;
const gridEl = document.getElementById("songGrid");
const paginationEl = document.getElementById("pagination");
const toastEl = document.getElementById("toast");
const searchInput = document.getElementById("searchInput");
const searchClear = document.getElementById("searchClear");
let currentPage = 1;
let query = "";
let toastTimer = null;
let picked = -1;

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1600);
}

// 过长的歌名/曲师自动缩小字号，最多两行，保持封面尺寸一致
function shrinkToLines(el, maxLines, minPx) {
  el.style.fontSize = "";
  let size = parseFloat(getComputedStyle(el).fontSize) || 16;
  let guard = 0;
  while (guard++ < 80) {
    const lh = parseFloat(getComputedStyle(el).lineHeight) || size * 1.3;
    const lines = Math.round(el.scrollHeight / lh);
    if (lines <= maxLines || size <= minPx) break;
    size = Math.max(minPx, size - 0.5);
    el.style.fontSize = size + "px";
  }
}

function fitText() {
  document.querySelectorAll(".song-name").forEach(el => shrinkToLines(el, 2, 10));
  document.querySelectorAll(".song-artist").forEach(el => shrinkToLines(el, 2, 9));
}

function currentSongs() {
  const q = query.trim().toLowerCase();
  if (!q) return songs;
  return songs.filter(s => s.name.toLowerCase().includes(q) || s.artist.toLowerCase().includes(q));
}

function renderSongs() {
  const list = currentSongs();
  const start = (currentPage - 1) * PAGE_SIZE;
  const pageSongs = list.slice(start, start + PAGE_SIZE);

  if (!pageSongs.length) {
    gridEl.innerHTML = `<div class="empty">${query ? "没有找到匹配的歌曲" : "还没有添加曲目"}</div>`;
    return;
  }

  gridEl.innerHTML = pageSongs.map(s => {
    const globalIndex = songs.indexOf(s);
    const cover = s.cover
      ? `<img src="${coverSrc(s.cover)}" alt="${s.name}" loading="lazy" onerror="this.style.display='none'">`
      : "";
    const hasLink = s.url || (s.urls && Object.keys(s.urls).some(k => s.urls[k]));
    const listen = hasLink
      ? `<button class="btn listen-btn" type="button" data-index="${globalIndex}">收听</button>`
      : `<span class="btn is-disabled" title="链接待补充">收听</span>`;
    return `
      <article class="song-card${globalIndex === picked ? " highlight" : ""}" data-index="${globalIndex}">
        <div class="cover">${cover}</div>
        <div class="song-name">${s.name}</div>
        <div class="song-artist">${s.artist}</div>
        <div class="song-actions">
          <button class="btn copy-btn" data-index="${globalIndex}">复制</button>
          ${listen}
        </div>
      </article>
    `;
  }).join("");

  bindCopy();
  fitText();
}

function pageItems(current, total) {
  const items = [];
  if (total <= 7) {
    for (let i = 1; i <= total; i++) items.push(i);
    return items;
  }
  items.push(1);
  const start = Math.max(2, current - 1);
  const end = Math.min(total - 1, current + 1);
  if (start > 2) items.push("...");
  for (let i = start; i <= end; i++) items.push(i);
  if (end < total - 1) items.push("...");
  items.push(total);
  return items;
}

function gotoPage(p) {
  const totalPages = Math.ceil(currentSongs().length / PAGE_SIZE);
  currentPage = Math.min(Math.max(1, p), Math.max(1, totalPages));
  renderSongs();
  renderPagination();
}

function renderPagination() {
  const totalPages = Math.ceil(currentSongs().length / PAGE_SIZE);
  if (totalPages <= 0) { paginationEl.innerHTML = ""; return; }

  const nums = pageItems(currentPage, totalPages).map(v => v === "..."
    ? `<span class="page-ellipsis">…</span>`
    : `<button class="page-btn ${v === currentPage ? "active" : ""}" data-page="${v}">${v}</button>`
  ).join("");

  paginationEl.innerHTML = `
    <div class="page-list">${nums}</div>
    <div class="page-jump">
      <input id="jumpInput" type="number" min="1" max="${totalPages}" placeholder="输入页码" inputmode="numeric">
      <button id="jumpBtn" type="button">跳转</button>
    </div>
  `;

  paginationEl.querySelectorAll(".page-btn").forEach(btn => {
    btn.addEventListener("click", () => gotoPage(Number(btn.dataset.page)));
  });

  const jumpInput = document.getElementById("jumpInput");
  const jumpBtn = document.getElementById("jumpBtn");
  const submitJump = () => {
    const v = parseInt(jumpInput.value, 10);
    if (!Number.isNaN(v)) gotoPage(v);
  };
  jumpBtn.addEventListener("click", submitJump);
  jumpInput.addEventListener("keydown", e => { if (e.key === "Enter") submitJump(); });
}

async function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    await navigator.clipboard.writeText(text);
    return;
  }
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  document.execCommand("copy");
  ta.remove();
}

function bindCopy() {
  document.querySelectorAll(".copy-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
      const song = songs[btn.dataset.index];
      const text = `${song.name} - ${song.artist}`;
      try {
        await copyText(text);
        btn.textContent = "已复制";
        btn.classList.add("copied");
        showToast(`已复制：${text}`);
        setTimeout(() => {
          btn.textContent = "复制";
          btn.classList.remove("copied");
        }, 1500);
      } catch {
        showToast("复制失败，请手动复制");
      }
    });
  });
}

// 搜索
searchInput.addEventListener("input", () => {
  query = searchInput.value;
  currentPage = 1;
  searchClear.hidden = !query;
  renderSongs();
  renderPagination();
});

searchClear.addEventListener("click", () => {
  searchInput.value = "";
  query = "";
  currentPage = 1;
  searchClear.hidden = true;
  renderSongs();
  renderPagination();
  searchInput.focus();
});

// 视频背景开关（默认关）
const videoEl = document.getElementById("bgVideo");
const toggleEl = document.getElementById("videoToggle");
const stateEl = toggleEl.querySelector(".vt-state");
const STORE_KEY = "music-chaos-video";

function readStore(key) { try { return localStorage.getItem(key); } catch { return null; } }
function writeStore(key, val) { try { localStorage.setItem(key, val); } catch {} }

let videoOn = readStore(STORE_KEY) !== "on";
function applyVideo() {
  document.body.classList.toggle("video-on", videoOn);
  stateEl.textContent = videoOn ? "开" : "关";
  toggleEl.setAttribute("aria-pressed", String(videoOn));
  if (videoOn) { videoEl.play().catch(() => {}); } else { videoEl.pause(); }
}
toggleEl.addEventListener("click", () => {
  videoOn = !videoOn;
  writeStore(STORE_KEY, videoOn ? "on" : "off");
  applyVideo();
});
applyVideo();

// 高画质开关（默认关）：关=压缩封面，开=原图
const HQ_KEY = "music-hq";
let hqMode = readStore(HQ_KEY) === "on";

function coverSrc(c) {
  if (!c) return "";
  if (!hqMode) return c;
  return c.replace(/^covers\//, "covers-hq/").replace(/\.jpg$/i, ".png");
}

const qualityToggle = document.getElementById("qualityToggle");
const qualityState = qualityToggle.querySelector(".vt-state");

function applyQuality() {
  qualityToggle.setAttribute("aria-pressed", String(hqMode));
  qualityState.textContent = hqMode ? "开" : "关";
}
qualityToggle.addEventListener("click", () => {
  hqMode = !hqMode;
  writeStore(HQ_KEY, hqMode ? "on" : "off");
  applyQuality();
  renderSongs();
});
applyQuality();


// --- listen-picker ---
const SERVICES = [
  { key: "netease",  label: "网易云app",      icon: "icons/netease.png"  },
  { key: "kugou",    label: "酷狗概念版网页", icon: "icons/kugou.png"    },
  { key: "bilibili", label: "b站网页",        icon: "icons/bilibili.png" },
];

const listenModal = document.getElementById("listenModal");
const listenTitle = document.getElementById("listenTitle");
const listenSub = document.getElementById("listenSub");
const listenOptions = document.getElementById("listenOptions");

function attr(v) {
  return String(v).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// 把一首歌的链接按渠道归位（支持 s.urls 多链接，也兼容现在的单个 s.url）
function linksOf(song) {
  const out = { netease: "", kugou: "", bilibili: "", other: "" };
  if (song.urls) { for (const k in out) { if (song.urls[k]) out[k] = song.urls[k]; } }
  const u = song.url || "";
  if (u) {
    let k = "other";
    if (u.indexOf("orpheus://") === 0) k = "netease";
    else if (/kugou\.com/i.test(u)) k = "kugou";
    else if (/bilibili\.com/i.test(u)) k = "bilibili";
    if (!out[k]) out[k] = u;
  }
  return out;
}

function openListen(song) {
  const links = linksOf(song);
  listenTitle.textContent = song.name;
  listenSub.textContent = song.artist || "未知";

  let html = "";
  for (const svc of SERVICES) {
    const url = links[svc.key];
    if (url) {
      const external = /^https?:/i.test(url);
      html += `<a class="listen-opt" href="${attr(url)}"${external ? ' target="_blank" rel="noopener"' : ""}>`
            + `<img class="listen-icon" src="${svc.icon}" alt="">`
            + `<span class="listen-label">${svc.label}</span></a>`;
    } else {
      html += `<button class="listen-opt is-off" type="button" disabled>`
            + `<img class="listen-icon" src="${svc.icon}" alt="">`
            + `<span class="listen-label">${svc.label}</span>`
            + `<span class="listen-tag">未配置</span></button>`;
    }
  }
  if (links.other) {
    html += `<a class="listen-opt" href="${attr(links.other)}" target="_blank" rel="noopener">`
          + `<span class="listen-icon listen-icon-text">▶</span>`
          + `<span class="listen-label">其它链接</span></a>`;
  }
  listenOptions.innerHTML = html;
  listenModal.hidden = false;
}

function closeListen() {
  listenModal.hidden = true;
  listenOptions.innerHTML = "";
}

listenModal.querySelectorAll("[data-close]").forEach(el => el.addEventListener("click", closeListen));
listenOptions.addEventListener("click", e => { if (e.target.closest("a.listen-opt")) closeListen(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !listenModal.hidden) closeListen(); });

gridEl.addEventListener("click", e => {
  const btn = e.target.closest(".listen-btn");
  if (!btn) return;
  const song = songs[Number(btn.dataset.index)];
  if (song) openListen(song);
});
// --- /listen-picker ---

// 随机：洗牌袋 —— 一轮内不重复，抽完再重新洗
let bag = [];
let bagSig = "";

function nextRandomPos(list) {
  const sig = query + "|" + list.length;
  if (sig !== bagSig) { bag = []; bagSig = sig; }
  if (!bag.length) {
    bag = list.map((_, i) => i);
    for (let i = bag.length - 1; i > 0; i--) {
      let j;
      if (window.crypto && window.crypto.getRandomValues) {
        const buf = new Uint32Array(1);
        window.crypto.getRandomValues(buf);
        j = buf[0] % (i + 1);
      } else {
        j = Math.floor(Math.random() * (i + 1));
      }
      const t = bag[i]; bag[i] = bag[j]; bag[j] = t;
    }
  }
  return bag.pop();
}

document.getElementById("randomBtn").addEventListener("click", () => {
  const list = currentSongs();
  if (!list.length) return;

  const pos = nextRandomPos(list);
  picked = songs.indexOf(list[pos]);
  currentPage = Math.floor(pos / PAGE_SIZE) + 1;

  renderSongs();
  renderPagination();

  const target = document.querySelector(`.song-card[data-index="${picked}"]`);
  if (target) target.scrollIntoView({ behavior: "smooth", block: "center" });
});

renderSongs();
renderPagination();

if (document.fonts) {
  document.fonts.addEventListener("loadingdone", fitText);
  if (document.fonts.ready) document.fonts.ready.then(fitText);
}

// 左右方向键翻页
document.addEventListener("keydown", (e) => {
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
  if (e.key === "ArrowLeft") { e.preventDefault(); gotoPage(currentPage - 1); }
  else if (e.key === "ArrowRight") { e.preventDefault(); gotoPage(currentPage + 1); }
});

// 场景转场：站内跳转先淡出再跳
document.addEventListener("click", (e) => {
  const a = e.target.closest("a[href]");
  if (!a) return;
  if (e.button !== 0 || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return;
  if (a.target === "_blank" || a.hasAttribute("download")) return;
  const href = a.getAttribute("href");
  if (!href || href.startsWith("#") || /^[a-z][a-z0-9+.-]*:/i.test(href)) return;
  e.preventDefault();
  document.body.classList.add("is-leaving");
  setTimeout(() => { window.location.href = href; }, 200);
});</script>
