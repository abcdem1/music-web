tierListEl.innerHTML = tiers.map(t => `
  <div class="tier">
    <div class="tier-label" style="--tier-color:${t.color}">${t.label}</div>
    <div class="tier-songs">
      ${t.songs.map((s, i) => `
        <span class="tile" title="点击查看详情" data-tier="${t.label}" data-index="${i}">

  </div>
`).join("");

// 收听渠道
const SERVICES = [
  { key: "netease",  label: "网易云app",      icon: "icons/netease.png"  },
  { key: "kugou",    label: "酷狗概念版网页", icon: "icons/kugou.png"    },
  { key: "bilibili", label: "b站网页",        icon: "icons/bilibili.png" },
];

const modal = document.getElementById("modal");
const modalCover = document.getElementById("modalCover");
const modalTitle = document.getElementById("modalTitle");
const modalArtist = document.getElementById("modalArtist");
const modalIntro = document.getElementById("modalIntro");
const modalLinks = document.getElementById("modalLinks");
const modalCopy = document.getElementById("modalCopy");
const toastEl = document.getElementById("toast");
let toastTimer = null;
let currentSong = null;

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1600);
}

function attr(v) {
  return String(v).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// 把链接按渠道归位（支持 s.urls 多链接，也兼容单个 s.url）
function linksOf(song) {
  const out = { netease: "", kugou: "", bilibili: "", other: "" };
  if (song.urls) { for (const k in out) { if (song.urls[k]) out[k] = song.urls[k]; } }
  const u = song.url || "";
  if (u) {
    let k = "other";
    if (u.indexOf("orpheus://") === 0) k = "netease";
    else if (/kugou\.com/i.test(u)) k = "kugou";
    else if (/bilibili\.com/i.test(u)) k = "bilibili";
    if (!out[k]) out[k] = u;
  }
  return out;
}

function renderLinks(song) {
  const links = linksOf(song);
  let html = "";
  for (const svc of SERVICES) {
    const url = links[svc.key];
    if (url) {
      const external = /^https?:/i.test(url);
      html += `<a class="listen-opt" href="${attr(url)}"${external ? ' target="_blank" rel="noopener"' : ""}>`
            + `<img class="listen-icon" src="${svc.icon}" alt="">`
            + `<span class="listen-label">${svc.label}</span></a>`;
    } else {
      html += `<button class="listen-opt is-off" type="button" disabled>`
            + `<img class="listen-icon" src="${svc.icon}" alt="">`
            + `<span class="listen-label">${svc.label}</span>`
            + `<span class="listen-tag">未配置</span></button>`;
    }
  }
  if (links.other) {
    html += `<a class="listen-opt" href="${attr(links.other)}" target="_blank" rel="noopener">`
          + `<span class="listen-icon listen-icon-text">▶</span>`
          + `<span class="listen-label">其它链接</span></a>`;
  }
  modalLinks.innerHTML = html;
}

async function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return; }
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  document.execCommand("copy");
  ta.remove();
}

function openModal(song) {
  currentSong = song;
  modalCover.src = song.cover;
  modalCover.alt = song.name;
  modalTitle.textContent = song.name;
  modalArtist.textContent = song.artist || "未知";
  modalIntro.textContent = song.intro || "";
  renderLinks(song);
  modalCopy.textContent = "复制";
  modalCopy.classList.remove("done");
  modal.hidden = false;
}

function closeModal() {
  modal.hidden = true;
  modalCover.src = "";
  currentSong = null;
}

modalCopy.addEventListener("click", async () => {
  if (!currentSong) return;
  const text = `${currentSong.name} - ${currentSong.artist}`;
  try {
    await copyText(text);
    modalCopy.textContent = "已复制";
    modalCopy.classList.add("done");
    showToast(`已复制：${text}`);
    setTimeout(() => { modalCopy.textContent = "复制"; modalCopy.classList.remove("done"); }, 1500);
  } catch {
    showToast("复制失败，请手动复制");
  }
});

tierListEl.querySelectorAll(".tile").forEach(tile => {
  tile.addEventListener("click", () => {
    const tier = tiers.find(x => x.label === tile.dataset.tier);
    openModal(tier.songs[Number(tile.dataset.index)]);
  });
});

modal.querySelectorAll("[data-close]").forEach(el => el.addEventListener("click", closeModal));
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !modal.hidden) closeModal();
});
